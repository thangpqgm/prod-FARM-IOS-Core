<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phone Farm</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/assets/index.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand"><a class="brand-name" href="/">Phone Farm</a><span class="brand-by">nuôi acc TikTok theo niche</span></div>
            <nav class="topbar-nav">
                <a class="button secondary" href="/devices/register">Đăng ký máy</a>
                <button id="refresh" class="button secondary" type="button">↻ Quét lại</button>
            </nav>
        </div>
    </header>
    <main class="shell">
        <section class="farm-section">
            <div class="section-heading">
                <div><span class="eyebrow">Thiết bị</span><h2>Máy đang cắm <span id="device-count" class="count"></span></h2></div>
            </div>
            <div id="devices" class="farm-devices" aria-live="polite">
                <div class="loading-card"><span class="spinner" aria-hidden="true"></span>Đang tìm máy…</div>
            </div>
            <p class="hint">Bấm vào một máy để xem màn hình, điều khiển, đặt passcode và căn tọa độ nút (kể cả nút search).</p>
        </section>

        <section class="farm-section">
            <div class="section-heading">
                <div><span class="eyebrow">Nuôi theo niche</span><h2>Tài khoản <span id="account-count" class="count"></span></h2></div>
                <button id="add-account" class="button primary" type="button">+ Thêm acc</button>
            </div>
            <p id="page-error" class="run-error" hidden></p>
            <div class="account-table-wrap">
                <table class="account-table">
                    <thead><tr><th>Acc</th><th>Máy</th><th>Niche (keywords)</th><th>Giờ chạy</th><th>Lần cuối</th><th></th></tr></thead>
                    <tbody id="accounts"><tr><td colspan="6" class="muted-cell">Đang tải…</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>
    <footer class="app-footer">__FOOTER__</footer>
</body>
</html>
